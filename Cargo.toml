[package]
name = "serialhub"
version = "1.6.0"
edition = "2021"
description = "SerialHub — 串口 <-> WebSocket 桥接, 跨平台单二进制 + 内嵌 Web 控制台"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
serialport = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
wry = "0.57.0"
tao = "0.37.0"
tray-icon = "0.25.0"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
png = "0.17"   # FR-15: 构建期把托盘/窗口 PNG 解码成 RGBA (存在才嵌入, 见 build.rs)
winres = "0.1" # FR-15: exe 内嵌 app.ico (build.rs 仅在 Windows 目标且文件存在时调用)
