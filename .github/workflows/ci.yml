# SerialHub CI —— push(main) / PR 触发, 三平台 cargo build + 单元测试。
#
# 说明:
# - pytest (tests/) 需要 COM1/COM2 真实/虚拟串口对, CI 机器没有串口硬件,
#   因此不进 CI (由 QA 在带 ELTIMA 虚拟串口的机器上执行; COM8 真板永不用于测试)。
# - 技术债 (详见 docs/team/reports/ci-sprint6.md): cargo fmt --check (64 处 diff)
#   与 cargo clippy -- -D warnings (12 条) 当前不过, 质量门禁暂缓,
#   清债后取消注释下方 fmt / clippy 两步即可。
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: build+test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Linux 构建期系统依赖:
      # - pkg-config + libudev-dev: serialport 4 (libudev-sys 经 pkg-config 探测)
      # - libgtk-3-dev / libwebkit2gtk-4.1-dev: tao / wry —— GUI 无 feature 门,
      #   headless 形态也要能编译过
      # - libxdo-dev: tray-icon 默认 feature muda-libxdo, 链接期需要 libxdo.so
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev libgtk-3-dev libwebkit2gtk-4.1-dev libxdo-dev

      # —— 技术债, fmt / clippy 清债后放开 ——
      # - run: cargo fmt --all --check
      # - run: cargo clippy --all-targets -- -D warnings

      - name: cargo build
        run: cargo build --locked

      # 64 个单元测试不需要串口硬件: 监督测试用假打开器注入,
      # serial::list_ports_never_panics 在无串口机器上同样安全。
      - name: cargo test
        run: cargo test --locked
